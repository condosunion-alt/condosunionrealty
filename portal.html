<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broker & Client Portal - Condos Union Realty</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .portal-container { width: 100%; max-width: 480px; padding: 20px; }
        .logo { text-align: center; color: white; margin-bottom: 30px; }
        .logo h1 { font-size: 1.8em; }
        .logo p { opacity: 0.7; font-size: 0.9em; }
        .card { background: white; border-radius: 16px; padding: 40px 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .card h2 { text-align: center; color: #1a1a2e; margin-bottom: 8px; font-size: 1.5em; }
        .card .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }
        .tab-row { display: flex; margin-bottom: 25px; border-radius: 10px; overflow: hidden; border: 2px solid #f0f0f0; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #f9f9f9; cursor: pointer; font-size: 0.9em; font-weight: 600; color: #888; transition: all 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #333; font-size: 0.9em; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95em; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: 600; cursor: pointer; transition: opacity 0.3s; }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .toggle-link { text-align: center; margin-top: 20px; color: #666; font-size: 0.85em; }
        .toggle-link a { color: #667eea; text-decoration: none; font-weight: 600; }
        .toggle-link a:hover { text-decoration: underline; }
        .error-msg { color: #e74c3c; font-size: 0.85em; margin-top: 5px; display: none; }
        .success-msg { color: #27ae60; font-size: 0.85em; margin-top: 5px; display: none; }
        .features { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
        .feature-tag { background: #f0f4ff; color: #667eea; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; font-weight: 600; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="logo">
            <h1>🔷 Condos Union Realty</h1>
            <p>Exclusive Pre-Construction Access</p>
        </div>
        <div class="card" id="authCard">
            <div class="tab-row">
                <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" id="registerTab" onclick="switchTab('register')">Register</button>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm">
                <h2>Welcome Back</h2>
                <p class="subtitle">Login to access VIP projects</p>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required placeholder="••••••••">
                    </div>
                    <div class="error-msg" id="loginError"></div>
                    <button type="submit" class="submit-btn">Login</button>
                </form>
                <div class="features">
                    <span class="feature-tag">🔒 Secure Login</span>
                    <span class="feature-tag">📁 50+ Projects</span>
                    <span class="feature-tag">🏆 VIP Access</span>
                </div>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" class="hidden">
                <h2>Create Account</h2>
                <p class="subtitle">Get access to exclusive pre-construction projects</p>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Account Type</label>
                        <select id="regType" required>
                            <option value="">-- Select Type --</option>
                            <option value="broker">Real Estate Broker</option>
                            <option value="client">Potential Buyer / Investor</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" required placeholder="John Smith">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="regEmail" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="(416) 555-0123">
                    </div>
                    <div class="form-group" id="brokerField">
                        <label>Brokerage Name</label>
                        <input type="text" id="regBrokerage" placeholder="e.g. Remax, Century 21">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" required placeholder="Min 8 characters">
                    </div>
                    <div class="error-msg" id="regError"></div>
                    <div class="success-msg" id="regSuccess"></div>
                    <button type="submit" class="submit-btn">Create Account</button>
                </form>
                <div class="features">
                    <span class="feature-tag">🏆 VIP Project Access</span>
                    <span class="feature-tag">📊 Floor Plans</span>
                    <span class="feature-tag">💰 Co-broke Opportunities</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'login';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('loginTab').classList.toggle('active', tab === 'login');
            document.getElementById('registerTab').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
        }

        // Handle registration
        async function handleRegister(e) {
            e.preventDefault();
            const type = document.getElementById('regType').value;
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const brokerage = document.getElementById('regBrokerage').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorEl = document.getElementById('regError');
            const successEl = document.getElementById('regSuccess');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!type || !name || !email || password.length < 8) {
                errorEl.textContent = 'Please fill all required fields (password min 8 chars).';
                errorEl.style.display = 'block';
                return;
            }

            // Save to localStorage (simulate DB)
            const users = JSON.parse(localStorage.getItem('cur_users') || '{}');
            if (users[email]) {
                errorEl.textContent = 'An account with this email already exists.';
                errorEl.style.display = 'block';
                return;
            }

            users[email] = { type, name, email, phone, brokerage, password, registeredAt: new Date().toISOString() };
            localStorage.setItem('cur_users', JSON.stringify(users));

            successEl.textContent = '✅ Registration successful! Redirecting to projects...';
            successEl.style.display = 'block';

            // Auto-login
            localStorage.setItem('cur_loggedin', JSON.stringify({ email, name, type }));
            setTimeout(() => { window.location.href = 'platinum-projects.html'; }, 1500);
        }

        // Handle login
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            errorEl.style.display = 'none';

            const users = JSON.parse(localStorage.getItem('cur_users') || '{}');
            const user = users[email];

            if (!user || user.password !== password) {
                errorEl.textContent = 'Invalid email or password.';
                errorEl.style.display = 'block';
                return;
            }

            localStorage.setItem('cur_loggedin', JSON.stringify({ email: user.email, name: user.name, type: user.type }));
            window.location.href = 'platinum-projects.html';
        }

        // Check if already logged in
        if (localStorage.getItem('cur_loggedin')) {
            window.location.href = 'platinum-projects.html';
        }

        // Show/hide brokerage field
        document.getElementById('regType').addEventListener('change', function() {
            const brokerField = document.getElementById('brokerField');
            brokerField.style.display = this.value === 'broker' ? 'block' : 'none';
        });
    </script>
</body>
</html>
